name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /body-reconstruction/
      - name: Publish static branch
        run: |
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/pages-out" origin/gh-pages
          rsync -a --delete --exclude='.git' dist/ "$RUNNER_TEMP/pages-out/"
          touch "$RUNNER_TEMP/pages-out/.nojekyll"
          git -C "$RUNNER_TEMP/pages-out" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/pages-out" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/pages-out" add --all
          if ! git -C "$RUNNER_TEMP/pages-out" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/pages-out" commit -m "Publish $GITHUB_SHA"
            git -C "$RUNNER_TEMP/pages-out" push origin HEAD:gh-pages
          fi
      - name: Request native Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
